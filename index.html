<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farhan Business Pay - Admin</title>
    <style>
        :root {
            --primary: #cc0000;
            --primary-dark: #990000;
            --primary-light: #ffebee;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #666666;
            --border-color: #e0e0e0;
            --shadow-3d: 0 10px 25px rgba(204, 0, 0, 0.12), 0 4px 10px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            padding: 15px;
        }

        .card {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            padding: 30px 24px;
            border-radius: 20px;
            border-top: 6px solid var(--primary);
            box-shadow: var(--shadow-3d);
            border-left: 1px solid rgba(255,255,255,0.7);
            border-right: 1px solid rgba(0,0,0,0.05);
            border-bottom: 2px solid rgba(0,0,0,0.08);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            color: var(--primary);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            color: var(--text-sub);
            font-size: 12px;
            margin-top: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .custom-input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            background: #fafafa;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .custom-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .eye-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: var(--text-sub);
            user-select: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(204, 0, 0, 0.25);
            transition: all 0.15s ease;
        }

        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 6px rgba(204, 0, 0, 0.25);
        }

        .btn-biometric {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            background: #2b2b2b;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.15s ease;
        }

        .btn-biometric:active {
            transform: translateY(2px);
            background: #1f1f1f;
        }

        /* Dashboard View */
        #dashboardScreen { display: none; }

        .key-list {
            margin-top: 20px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .key-list::-webkit-scrollbar {
            width: 5px;
        }
        .key-list::-webkit-scrollbar-thumb {
            background: #dcdcdc;
            border-radius: 10px;
        }

        .key-card {
            background: #ffffff;
            border: 1px solid #ebebeb;
            border-left: 5px solid var(--primary);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.03);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge-live {
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .data-box {
            background: #f8f9fa;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            font-family: "SFMono-Regular", Consolas, Menlo, monospace;
            font-size: 12px;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
        }

        .data-label {
            color: var(--text-sub);
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 3px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .btn-prompt-full {
            grid-column: span 3;
            background: #5e35b1;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(94, 53, 177, 0.2);
        }

        .btn-action {
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
        }

        .btn-copy { background: #2e7d32; }
        .btn-rename { background: #0277bd; }
        .btn-delete { background: #c62828; }

        /* Custom Modal (पॉप-अप विंडो) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 24px;
            border-radius: 16px;
            border-top: 5px solid var(--primary);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 16px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-btn-cancel {
            background: #eeeeee;
            color: #444444;
        }

        .modal-btn-confirm {
            background: var(--primary);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="card" id="loginScreen">
        <div class="brand-header">
            <div class="brand-title">Farhan Business Pay</div>
            <div class="brand-subtitle">UNIVERSAL API GATEWAY</div>
        </div>
        <div class="input-wrapper">
            <input type="password" id="adminPass" class="custom-input" placeholder="सुरक्षित पासवर्ड दर्ज करें" />
            <span class="eye-toggle" onclick="togglePassword('adminPass')">👁️</span>
        </div>
        <button class="btn-primary" onclick="login()">Login to Dashboard</button>
        <button class="btn-biometric" onclick="bioLogin()">
            <span>📱</span> Use Face ID / Biometric
        </button>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div class="card" id="dashboardScreen">
        <div class="brand-header">
            <div class="brand-title">API Dashboard</div>
            <div class="brand-subtitle">CENTRAL ACCESS CONTROLLER</div>
        </div>
        <div class="input-wrapper">
            <input type="text" id="newAppName" class="custom-input" placeholder="नया ऐप नाम (उदा: ChatApp)" />
        </div>
        <button class="btn-primary" onclick="generateKey()">Generate New API Key</button>
        <div class="key-list" id="keysContainer"></div>
    </div>

    <!-- 3. CUSTOM MODAL (कस्टम पॉप-अप) -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">शीर्षक</div>
            <div class="modal-desc" id="modalDesc">विवरण</div>
            <div class="input-wrapper" id="modalInputWrapper" style="display: none;">
                <input type="text" id="modalInput" class="custom-input" placeholder="" />
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">रद्द करें</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">ठीक है</button>
            </div>
        </div>
    </div>

<script>
    const SERVER_URL = "https://farhan-business-pay.onrender.com/create-order";
    let currentPassword = '';

    function togglePassword(fieldId) {
        const input = document.getElementById(fieldId);
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    /* Modal System */
    let modalCallback = null;
    function showModal(title, desc, hasInput, defaultValue, callback) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalDesc').innerText = desc;
        const inputWrapper = document.getElementById('modalInputWrapper');
        const inputField = document.getElementById('modalInput');
        
        if (hasInput) {
            inputWrapper.style.display = 'block';
            inputField.value = defaultValue || '';
        } else {
            inputWrapper.style.display = 'none';
        }

        document.getElementById('customModal').style.display = 'flex';
        modalCallback = callback;
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
        modalCallback = null;
    }

    document.getElementById('modalConfirmBtn').addEventListener('click', () => {
        const value = document.getElementById('modalInput').value;
        if (modalCallback) modalCallback(value);
        closeModal();
    });

    /* API Operations */
    async function login(pass = null) {
        currentPassword = pass || document.getElementById('adminPass').value;
        try {
            const res = await fetch('/api/keys', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ password: currentPassword })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                renderKeys(data.keys);
            } else {
                showModal("लॉगिन विफल", "❌ अमान्य पासवर्ड! कृपया सही पासवर्ड दर्ज करें।", false, null, null);
            }
        } catch(e) {
            showModal("सर्वर एरर", "सर्वर से कनेक्ट नहीं हो पा रहा है। जांचें कि Render सर्वर चालू है या नहीं।", false, null, null);
        }
    }

    async function bioLogin() {
        try {
            if(localStorage.getItem('faceID_enabled') === 'true') {
                const reqOpts = { challenge: new Uint8Array(32), timeout: 60000, userVerification: "required" };
                await navigator.credentials.get({ publicKey: reqOpts });
                login(localStorage.getItem('saved_pass'));
            } else {
                showModal("बायोमेट्रिक सेटअप", "Face ID / फिंगरप्रिंट सेट करने के लिए अपना पासवर्ड दर्ज करें:", true, "", async (pass) => {
                    if(!pass) return;
                    const res = await fetch('/api/keys', { 
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify({ password: pass })
                    });
                    const data = await res.json();
                    
                    if(data.success) {
                        const createOpts = {
                            challenge: new Uint8Array(32),
                            rp: { name: "Farhan Business Pay", id: window.location.hostname },
                            user: { id: new Uint8Array(16), name: "Admin", displayName: "Farhan" },
                            pubKeyCredParams: [{alg: -7, type: "public-key"}],
                            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                            timeout: 60000
                        };
                        await navigator.credentials.create({ publicKey: createOpts });
                        localStorage.setItem('faceID_enabled', 'true');
                        localStorage.setItem('saved_pass', pass);
                        showModal("सफल", "✅ बायोमेट्रिक सफलतापूर्वक रजिस्टर हो गया!", false, null, () => login(pass));
                    } else {
                        showModal("त्रुटि", "❌ गलत पासवर्ड! बायोमेट्रिक सेट नहीं हो सकता।", false, null, null);
                    }
                });
            }
        } catch(e) {
            showModal("बायोमेट्रिक एरर", e.message, false, null, null);
        }
    }

    async function generateKey() {
        const appName = document.getElementById('newAppName').value.trim();
        if(!appName) return showModal("आवश्यक", "कृपया ऐप का नाम दर्ज करें।", false, null, null);
        
        const res = await fetch('/api/generate', {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ password: currentPassword, appName })
        });
        const data = await res.json();
        if(data.success) { 
            document.getElementById('newAppName').value = ''; 
            renderKeys(data.keys); 
        }
    }

    function renameKey(oldName) {
        showModal("नाम बदलें", `'${oldName}' का नया नाम दर्ज करें:`, true, oldName, async (newName) => {
            if(!newName || newName === oldName) return;
            const res = await fetch('/api/rename', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ password: currentPassword, oldName, newName })
            });
            const data = await res.json();
            if(data.success) renderKeys(data.keys);
        });
    }

    function deleteKey(appName) {
        showModal("हटाने की पुष्टि", `क्या आप सच में '${appName}' की API Key हटाना चाहते हैं?`, false, null, async () => {
            const res = await fetch('/api/delete', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ password: currentPassword, appName })
            });
            const data = await res.json();
            if(data.success) renderKeys(data.keys);
        });
    }

    function copyData(text, msg) {
        navigator.clipboard.writeText(text);
        showModal("कॉपी हुआ", msg, false, null, null);
    }

    function copyAIPrompt(appName, apiKey) {
        const promptText = `I am building an Android app named '${appName}'. I have a custom Node.js payment gateway integrated with Razorpay. To initiate a payment, you need to make a POST request to '${SERVER_URL}' with a JSON body: { "app_key": "${apiKey}", "amount": 100 } (amount is in INR). Please provide the Android Kotlin/Java architecture and code to implement this payment request securely.`;
        navigator.clipboard.writeText(promptText);
        showModal("AI प्रॉम्प्ट कॉपी हुआ", "यह प्रॉम्प्ट कॉपी हो चुका है। इसे ChatGPT या Gemini में पेस्ट करके अपने ऐप का कोड तैयार करवा सकते हैं।", false, null, null);
    }

    function renderKeys(keys) {
        const container = document.getElementById('keysContainer');
        container.innerHTML = '';
        for(let name in keys) {
            container.innerHTML += `
                <div class="key-card">
                    <div class="app-header">
                        <span>📱 ${name}</span>
                        <span class="badge-live">Active</span>
                    </div>
                    <div class="data-box">
                        <span class="data-label">API Key</span>
                        <span>${keys[name]}</span>
                    </div>
                    <div class="data-box">
                        <span class="data-label">Request Endpoint</span>
                        <span style="color: var(--primary); font-weight: bold;">${SERVER_URL}</span>
                    </div>
                    <div class="actions-grid">
                        <button class="btn-prompt-full" onclick="copyAIPrompt('${name}', '${keys[name]}')">🤖 Copy AI Builder Prompt</button>
                        <button class="btn-action btn-copy" onclick="copyData('${keys[name]}', 'API Key क्लिपबोर्ड में कॉपी हो गई!')">Copy Key</button>
                        <button class="btn-action btn-rename" onclick="renameKey('${name}')">Rename</button>
                        <button class="btn-action btn-delete" onclick="deleteKey('${name}')">Delete</button>
                    </div>
                </div>
            `;
        }
    }
</script>
</body>
</html>
